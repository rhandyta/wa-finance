version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wa_finance}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    # Unbind host ports to prevent port clash on Coolify. We only expose to the internal docker network.
    ports:
      - "3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wa-finance-network
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p$${MYSQL_ROOT_PASSWORD} -e 'SELECT 1;' || exit 1"]
      timeout: 30s
      retries: 10
      start_period: 40s
      interval: 10s
    restart: always

  backend:
    build:
      context: ./wa-finance-be
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-wa_finance}
      MYSQL_DATABASE: ${DB_NAME:-wa_finance}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      HTTP_API_KEY: ${HTTP_API_KEY}
      OCR_TIMEOUT_MS: 120000
      PYTHON_BIN: python3
      QR_AUTH_TOKEN: ${QR_AUTH_TOKEN}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      # It is best to set EXPO_PUBLIC_BASE_URL via Coolify Environment Variables
      EXPO_PUBLIC_BASE_URL: ${EXPO_PUBLIC_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE_URL: ${DEEPSEEK_API_BASE_URL:-https://api.deepseek.com/v1}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET}
      RECEIPT_RETENTION_DAYS: ${RECEIPT_RETENTION_DAYS}
      DISABLE_BOT: ${DISABLE_BOT:-0}
    # Exposing the internal port to Coolify's reverse proxy
    ports:
      - "3000"
    volumes:
      # These volumes ensure session data and uploaded files are not lost when the container is recreated
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
      - uploads_data:/app/public/uploads
    networks:
      - wa-finance-network
    restart: always

  frontend:
    build:
      context: ./wa-finance-fe
      dockerfile: Dockerfile
      args:
        # Pass the public base url to the frontend during build
        EXPO_PUBLIC_BASE_URL: ${EXPO_PUBLIC_BASE_URL}
    # Exposing port 80 to Coolify's Traefik / Caddy
    ports:
      - "80"
    depends_on:
      - backend
    networks:
      - wa-finance-network
    restart: always

volumes:
  mysql_data:
  wwebjs_auth:
  wwebjs_cache:
  uploads_data:

networks:
  wa-finance-network:
    driver: bridge
