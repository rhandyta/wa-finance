services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wa_finance}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  backend:
    build:
      context: ./wa-finance-be
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-wa_finance}
      HTTP_API_KEY: ${HTTP_API_KEY}
      OCR_TIMEOUT_MS: 120000
      PYTHON_BIN: python3
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      EXPO_PUBLIC_BASE_URL: ${EXPO_PUBLIC_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE_URL: ${DEEPSEEK_API_BASE_URL:-https://api.deepseek.com/v1}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET}
      DISABLE_BOT: ${DISABLE_BOT:-0}
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
      - uploads_data:/app/public/uploads
    restart: always

  frontend:
    build:
      context: ./wa-finance-fe
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_BASE_URL: ${EXPO_PUBLIC_BASE_URL}
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
  wwebjs_auth:
  wwebjs_cache:
  uploads_data:
