services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wa_finance
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./wa-finance-be
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: wa_finance
      HTTP_API_KEY: ${HTTP_API_KEY:-change-me}
      OCR_TIMEOUT_MS: 120000
      PYTHON_BIN: python3
      CORS_ALLOW_ORIGINS: http://localhost:19006,http://localhost:3000
      EXPO_PUBLIC_BASE_URL: http://localhost:3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:-}
      DISABLE_BOT: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./wa-finance-be:/app
      - /app/node_modules

  frontend:
    build:
      context: ./wa-finance-fe
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
